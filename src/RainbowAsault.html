<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rainbow Assault - Military Unicorn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="contenedor-juego">
    <canvas id="lienzoJuego"></canvas>

    <div id="hud">
      <div class="tarjeta-hud">
        <span style="font-size: 20px;">🦄</span>
        <div>
          <div style="font-size: 11px; text-transform: uppercase; color: #ff99dd; font-weight: bold;">HEALTH</div>
          <div class="contenedor-barra-salud">
            <div id="barraSalud" class="barra-salud"></div>
          </div>
        </div>
      </div>
      <div class="tarjeta-hud">
        <div>
          <div style="font-size: 11px; text-transform: uppercase; color: #99ffff; font-weight: bold; text-align: right;">SCORE</div>
          <div id="textoPuntuacion" class="texto-puntuacion">00000</div>
        </div>
      </div>
    </div>

    <div class="ui-tactil" id="controlesTactiles">
      <div class="grupo-izquierdo">
        <div class="base-joystick" id="baseJoystick">
          <div class="palanca-joystick" id="palancaJoystick"></div>
        </div>
      </div>
      <div class="grupo-derecho">
        <div class="boton-accion boton-salto" id="botonSalto">⬆️</div>
        <div class="boton-accion boton-disparo" id="botonDisparo">🌈</div>
      </div>
    </div>

    <div id="pantallaSuperpuesta" class="pantalla-superpuesta">
      <h1 class="titulo-juego" id="tituloSuperpuesto">RAINBOW ASSAULT</h1>
      <p class="subtitulo-juego" id="subtituloSuperpuesto">Military Unicorns vs the Dark Horde</p>
      <button class="boton-inicio" id="botonInicio">FIGHT!</button>
    </div>
  </div>

<script src="main.js"></script>
</body>
</html>
